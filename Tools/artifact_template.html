<title>Salle du château</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Plein écran sombre, une seule ambiance (jeu) : la salle centrée, consigne en dessous */
  :root { --bg: #1d1526; --fg: #e9e2f3; --muted: #a596bb; color-scheme: dark; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; }
  body { font-family: system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px; box-sizing: border-box; }
  canvas { width: min(100%, 960px, calc((100dvh - 70px) * 4 / 3)); max-width: 100%; aspect-ratio: 4 / 3;
    border-radius: 6px; box-shadow: 0 8px 30px #0008; }
  p { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
</style>
<main>
  <canvas id="c" width="960" height="720"></canvas>
  <p>Clavier : flèches, ZQSD ou WASD. Téléphone : glisse ton doigt sur l'écran.</p>
</main>
<script>
const room = new Image(); room.src = "data:image/png;base64,{{ROOM}}";
const sheet = new Image(); sheet.src = "data:image/png;base64,{{AVATAR}}";

// Géométrie de la salle (mêmes valeurs que Tools/generate_room.py)
const VPX = 620, VPY = 130, FLOOR_Y = 270, FOC = 300, BL = 170, BR = 1070;
const ROOM_W = 1240, ROOM_H = 480;     // taille de la salle (unités)
const VIEW_W = 480, VIEW_H = 360;       // partie visible à l'écran (caméra rapprochée)
const DS = 960 / VIEW_W;                // pixels du canevas par unité
const EDGE = 75;                        // l'avatar reste à cette distance des bords de l'image
const AV_H = 84;                        // hauteur de l'image de l'avatar (unités) au fond de la salle
const FW = 172, FH = 303;               // taille d'une image de la planche (voir avatar_sheet.json)
const SPEED = 95;                       // unités monde / seconde
const MIN_Z = 135, MAX_Z = FOC - 6, MARGIN = 14;
const DIR = { down: 0, left: 1, right: 2, up: 3 };

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";

let camX = null, camY = 0;
const p = { wx: 620, z: 200, dir: DIR.down, t: 0, moving: false };
const keys = new Set();
addEventListener("keydown", e => { keys.add(e.code); if (e.code.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());

// joystick virtuel : on appuie n'importe où et on glisse
let stick = null;
const toCanvas = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
addEventListener("pointerdown", e => { const [x, y] = toCanvas(e); stick = { id: e.pointerId, ox: x, oy: y, x, y }; });
addEventListener("pointermove", e => { if (stick && e.pointerId === stick.id) [stick.x, stick.y] = toCanvas(e); });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; };
addEventListener("pointerup", endStick); addEventListener("pointercancel", endStick);

function input() {
  let x = 0, y = 0;
  const k = c => keys.has(c);
  if (k("ArrowLeft") || k("KeyA")) x -= 1;
  if (k("ArrowRight") || k("KeyD")) x += 1;
  if (k("ArrowUp") || k("KeyW")) y -= 1;
  if (k("ArrowDown") || k("KeyS")) y += 1;
  if (stick) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    if (d > 12) { const m = Math.min(1, d / 60); x = dx / d * m; y = dy / d * m; }
  }
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return [x, y];
}

function project(wx, z) {               // monde -> pixels natifs (pieds)
  const k = FOC / z;
  return [VPX + (wx - VPX) * k, VPY + (FLOOR_Y - VPY) * k, k];
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const [ix, iy] = input();
  p.moving = ix !== 0 || iy !== 0;
  if (p.moving) {
    p.z = Math.max(MIN_Z, Math.min(MAX_Z, p.z - iy * SPEED * dt));   // haut de l'écran = vers le fond
    const kz = FOC / p.z;
    const lo = Math.max(BL + MARGIN, VPX + (EDGE - VPX) / kz), hi = Math.min(BR - MARGIN, VPX + (ROOM_W - EDGE - VPX) / kz);
    p.wx = Math.max(lo, Math.min(hi, p.wx + ix * SPEED * dt));
    p.dir = Math.abs(ix) > Math.abs(iy) ? (ix < 0 ? DIR.left : DIR.right) : (iy < 0 ? DIR.up : DIR.down);
    p.t += dt;
  } else p.t = 0;

  const [sx, sy, k] = project(p.wx, p.z);
  const bodyY = sy - AV_H * k * 0.45;                              // centre du corps
  const tx = Math.max(0, Math.min(ROOM_W - VIEW_W, sx - VIEW_W / 2));   // la caméra suit l'avatar
  const ty = Math.max(0, Math.min(ROOM_H - VIEW_H, bodyY - VIEW_H / 2));
  if (camX === null) { camX = tx; camY = ty; }
  camX += (tx - camX) * Math.min(1, dt * 6); camY += (ty - camY) * Math.min(1, dt * 6);
  ctx.fillStyle = "#0e0916"; ctx.fillRect(0, 0, cv.width, cv.height);
  // salle en pixel art : pixels nets, caméra calée sur la grille de pixels de l'écran
  const cx0 = Math.round(camX * DS) / DS, cy0 = Math.round(camY * DS) / DS;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(room, -cx0 * DS, -cy0 * DS, ROOM_W * DS, ROOM_H * DS);
  ctx.imageSmoothingEnabled = true;

  const dh = AV_H * k * DS, dw = dh * FW / FH;                     // taille affichée
  const fx = (sx - cx0) * DS, fy = (sy - cy0) * DS;
  ctx.fillStyle = "rgba(40,24,56,0.28)";
  ctx.beginPath(); ctx.ellipse(fx, fy - dh * 0.02, dw * 0.3, dw * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  const col = p.moving ? Math.floor(p.t * 8) % 4 : 0;
  ctx.drawImage(sheet, col * FW + 1, p.dir * FH + 1, FW - 2, FH - 2, fx - dw / 2, fy - dh, dw, dh);   // marge de 1 px : pas de débord entre images

  if (stick) {
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.max(1, Math.hypot(dx, dy)), m = Math.min(d, 60);
    ctx.beginPath(); ctx.arc(stick.ox + dx / d * m, stick.oy + dy / d * m, 22, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(frame);
}
Promise.all([room.decode(), sheet.decode()]).then(() => requestAnimationFrame(frame));
</script>
