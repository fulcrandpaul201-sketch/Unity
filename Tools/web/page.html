<title>Pièce 3D v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Plein écran sombre, une seule ambiance (jeu) : la vue 3D occupe tout, aide discrète en bas */
  :root { --bg: #1d1526; --fg: #e9e2f3; --muted: #b3a6c8; --glass: rgba(29, 21, 38, 0.6); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; }
  body { font-family: system-ui, sans-serif; }
  main { position: relative; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .help { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 32px); box-sizing: border-box; margin: 0; padding: 6px 12px; border-radius: 8px;
    background: var(--glass); color: var(--muted); font-size: 13px; text-align: center; pointer-events: none; }
  .stick { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; }
  #ring { width: 110px; height: 110px; border: 3px solid rgba(255, 255, 255, 0.35); }
  #knob { width: 46px; height: 46px; background: rgba(255, 255, 255, 0.4); }
  #jump { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.5); background: var(--glass);
    color: var(--fg); font: 600 14px system-ui, sans-serif; touch-action: none; display: none; }
  #jump:active { background: rgba(255, 255, 255, 0.3); }
  #jump:focus-visible { outline: 3px solid #fff; }
  @media (pointer: coarse) { #jump { display: block; } }
</style>
<main>
  <canvas id="c"></canvas>
  <div id="ring" class="stick" hidden></div>
  <div id="knob" class="stick" hidden></div>
  <button id="jump" type="button">Sauter</button>
  <p class="help">Ordinateur : ZQSD ou WASD pour bouger, glisser la souris ou ← → pour tourner, molette pour zoomer, Espace pour sauter.
    Téléphone : doigt à gauche pour bouger, doigt à droite pour tourner, bouton Sauter.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
